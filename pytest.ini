; A BARE `pytest` MUST NOT TOUCH LIVE INFRASTRUCTURE.
;
; Without this file, pytest collected from the repo root, matched
; scripts/smoke_test.py on its default `*_test.py` pattern, and IMPORTED it —
; which for that script means running it, because its work happens at module
; level and ends in sys.exit. So `pytest` at the root created and deleted real
; accounts against whichever API the environment pointed at, and then died with
; INTERNALERROR instead of reporting anything.
;
; testpaths keeps collection inside api/tests. python_files drops the `*_test.py`
; half of the default pattern, so a future script named `<something>_test.py`
; cannot be swept in either. The smoke test stays a script you run on purpose:
;
;     PYTHONPATH=. python scripts/smoke_test.py
;
; pythonpath means `from api...` resolves without the caller remembering
; PYTHONPATH=. — one less way for a green run to depend on how it was invoked.

[pytest]
testpaths = api/tests
python_files = test_*.py
pythonpath = .
